name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Pick any available, already-paired iOS Simulator rather than
      # hardcoding a device name — the pre-created simulators on GitHub's
      # macOS runners vary by image/Xcode version.
      - name: Select iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in entries:
                  print(d["udid"])
                  sys.exit(0)
          sys.exit(1)
          ')
          echo "Selected simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # CougarSwift only declares iOS as a supported platform (no macOS), so
      # building/testing must target an iOS Simulator destination rather than
      # the native macOS host — otherwise SwiftPM falls back to an old macOS
      # deployment target that conflicts with dependencies like Supabase.
      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -scheme CougarSwift \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .build

      - name: Test without Building
        run: |
          xcodebuild test-without-building \
            -scheme CougarSwift \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .build
