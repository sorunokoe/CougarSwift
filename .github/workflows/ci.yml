name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # CougarSwift only declares iOS as a supported platform (no macOS), so
      # building/testing must target an iOS Simulator destination rather than
      # the native macOS host — otherwise SwiftPM falls back to an old macOS
      # deployment target that conflicts with dependencies like Supabase.
      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -scheme CougarSwift \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath .build

      - name: Test without Building
        run: |
          xcodebuild test-without-building \
            -scheme CougarSwift \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath .build
